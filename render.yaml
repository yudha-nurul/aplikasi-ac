services:
  - type: web
    name: aplikasi-ac
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TECHNICIAN_USERNAME
        value: teknisi
      - key: TECHNICIAN_PASSWORD
        sync: false
