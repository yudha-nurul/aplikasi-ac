<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teknisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 80% 0%, rgba(34,211,238,.15), transparent 28rem);">
    <main class="mx-auto mt-8 max-w-lg md:mt-12">
        <section class="rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Akun teknisi</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Edit Teknisi</h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">Ubah nomor HP dan reset password teknisi.</p>

            <form method="post" action="/teknisi/{{ teknisi.username }}/edit" class="mt-6 space-y-4">
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                    <input id="username" value="{{ teknisi.username }}" disabled class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-slate-500">
                </div>
                <div>
                    <label for="no_hp" class="block text-sm font-semibold text-slate-700 mb-2">No. HP</label>
                    <input id="no_hp" name="no_hp" type="tel" value="{{ teknisi.no_hp or '' }}" placeholder="Contoh: 081234567890" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password Baru</label>
                    <input id="password" name="password" type="password" placeholder="Kosongkan jika tidak ingin mengubah password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                </div>
                <button type="submit" class="w-full rounded-xl bg-blue-600 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:-translate-y-0.5 hover:bg-blue-700">Simpan Perubahan</button>
            </form>
            <a href="/dashboard" class="mt-6 block text-center text-sm font-medium text-slate-500 hover:text-blue-600">&#8592; Kembali ke dashboard</a>
        </section>
    </main>
</body>
</html>
