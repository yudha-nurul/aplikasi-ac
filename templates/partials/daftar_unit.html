{% for item in daftar_unit %}
<div class="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    
    <div class="flex items-center gap-3">
        {% if item.kode_unik %}
        <div class="bg-white p-1 rounded-lg border border-slate-200 flex-shrink-0 text-center">
            <img src="/generate-qr/{{ item.kode_unik }}" alt="QR Code" class="w-14 h-14 object-contain">
            <span class="text-[9px] font-mono font-bold text-slate-600 block -mt-1">{{ item.kode_unik }}</span>
        </div>
        {% endif %}

        <div>
            <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 font-bold text-xs rounded-md">{{ item.mode }}</span>
                <span class="font-bold text-slate-800 text-sm">{{ item.nama_pelanggan }}</span>
            </div>
            <p class="text-xs text-slate-600 font-medium mt-1">{{ item.unit }}</p>
        </div>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full 
            {% if item.status == 'Selesai' %} bg-green-100 text-green-700
            {% elif item.status == 'Dalam Proses' %} bg-blue-100 text-blue-700
            {% else %} bg-amber-100 text-amber-700 {% endif %}">
            {{ item.status }}
        </span>

        <button hx-post="/ubah-status/{{ item.id }}" 
                hx-target="#daftar-unit-container" 
                class="px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs rounded-lg font-medium transition">
            🔄
        </button>

        <button hx-post="/hapus-unit/{{ item.id }}" 
                hx-target="#daftar-unit-container"
                hx-confirm="Yakin ingin menghapus unit ini?"
                class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs rounded-lg font-medium transition">
            🗑️
        </button>
    </div>

</div>
{% else %}
<p class="text-sm text-slate-400 text-center py-4">Belum ada data unit terdaftar di database.</p>
{% endfor %}
