<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah History Servis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 85% 0%, rgba(34,211,238,.15), transparent 30rem);">
    <main class="mx-auto mt-8 max-w-3xl md:mt-12">
        <section class="rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">{{ unit.kode_unik }}</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Tambah History Servis</h1>
            <p class="text-sm text-slate-500 mt-2">{{ unit.nama_pelanggan }} - {{ unit.unit }}</p>

            <form method="post" enctype="multipart/form-data" action="/unit/{{ unit.kode_unik }}/tambah-history" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="tanggal" class="block text-sm font-semibold text-slate-700 mb-2">Tanggal</label>
                    <input id="tanggal" name="tanggal" type="date" value="{{ tanggal_sekarang }}" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="nama_teknisi" class="block text-sm font-semibold text-slate-700 mb-2">Nama Teknisi</label>
                    <input id="nama_teknisi" name="nama_teknisi" value="{{ nama_teknisi }}" readonly required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-600 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Item Servis</label>
                    <div id="service-items" class="space-y-2">
                        <input name="item_servis" required placeholder="Contoh: Cuci indoor & outdoor" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="button" id="add-service-item" class="mt-2 text-sm font-semibold text-blue-600 hover:text-blue-700">+ Tambah item servis</button>
                </div>
                <div>
                    <label for="kondisi_before" class="block text-sm font-semibold text-slate-700 mb-2">Kondisi Before</label>
                    <textarea id="kondisi_before" name="kondisi_before" required rows="4" placeholder="Kondisi sebelum servis" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <label for="foto_before" class="block text-xs font-semibold text-slate-500 mt-3 mb-2">Foto Before (kamera atau folder)</label>
                    <input id="foto_before" name="foto_before" type="file" accept="image/*" capture="environment" multiple class="w-full text-sm text-slate-500">
                </div>
                <div>
                    <label for="kondisi_after" class="block text-sm font-semibold text-slate-700 mb-2">Kondisi After</label>
                    <textarea id="kondisi_after" name="kondisi_after" required rows="4" placeholder="Kondisi setelah servis" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <label for="foto_after" class="block text-xs font-semibold text-slate-500 mt-3 mb-2">Foto After (kamera atau folder)</label>
                    <input id="foto_after" name="foto_after" type="file" accept="image/*" capture="environment" multiple class="w-full text-sm text-slate-500">
                </div>
                <div class="md:col-span-2">
                    <label for="servis_selanjutnya" class="block text-sm font-semibold text-slate-700 mb-2">Servis Selanjutnya</label>
                    <input id="servis_selanjutnya" name="servis_selanjutnya" type="date" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2 flex flex-col-reverse sm:flex-row gap-3 pt-2">
                    <a href="/unit/{{ unit.kode_unik }}" class="w-full text-center border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl">Batal</a>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl">Simpan History</button>
                </div>
            </form>
        </section>
    </main>
    <script>
        const serviceItems = document.getElementById('service-items');
        document.getElementById('add-service-item').addEventListener('click', () => {
            const input = document.createElement('input');
            input.name = 'item_servis';
            input.required = true;
            input.placeholder = 'Contoh: Isi freon atau ganti pipa freon';
            input.className = 'w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500';
            serviceItems.appendChild(input);
        });
    </script>
</body>
</html>
