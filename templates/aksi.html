<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ judul }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 50% 0%, rgba(34,211,238,.14), transparent 26rem);">
    <main class="mx-auto mt-16 max-w-md rounded-[2rem] bg-white/95 p-8 text-center shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20">
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-2xl text-amber-500">!</div>
        <h1 class="text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">{{ judul }}</h1>
        <p class="mt-3 text-sm leading-6 text-slate-500">{{ pesan }}</p>
        <a href="{{ dashboard_url|default('/') }}" class="mt-7 inline-flex rounded-xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">Kembali ke dashboard</a>
    </main>
</body>
</html>
