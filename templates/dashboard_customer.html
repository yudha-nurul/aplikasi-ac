<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pelanggan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 90% 0%, rgba(34,211,238,.16), transparent 28rem), radial-gradient(circle at 0% 65%, rgba(37,99,235,.2), transparent 34rem);">
    <main class="mx-auto max-w-2xl space-y-5">
        <header class="flex items-center justify-between gap-4 rounded-[2rem] bg-white/95 p-6 shadow-2xl shadow-cyan-950/20 ring-1 ring-white/20">
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Customer portal</p>
                <h1 class="mt-1 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Halo, {{ nama_pelanggan }}</h1>
            </div>
            <a href="/logout" class="text-sm text-slate-500 hover:text-blue-600">Keluar</a>
        </header>

        <section class="rounded-[2rem] bg-white/95 p-6 shadow-2xl shadow-cyan-950/20 ring-1 ring-white/20">
            <h2 class="text-xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Perangkat Saya</h2>
            <p class="text-sm text-slate-500 mt-1">Pilih perangkat untuk melihat status dan history servis.</p>
            <div class="mt-5 space-y-3">
                {% for unit in daftar_unit %}
                <a href="/unit/{{ unit.kode_unik }}" class="flex items-center justify-between gap-4 rounded-2xl border border-slate-200 bg-white px-4 py-4 shadow-sm transition hover:-translate-y-0.5 hover:border-blue-200 hover:bg-blue-50">
                    <img src="/generate-qr/{{ unit.kode_unik }}" alt="QR {{ unit.kode_unik }}" class="h-16 w-16 shrink-0 rounded-xl border border-slate-200 bg-white p-1">
                    <div class="min-w-0 flex-1">
                        <p class="font-semibold text-slate-800 truncate">{{ unit.unit }}</p>
                        <p class="text-xs text-slate-500 mt-1">{{ unit.mode }} <span class="mx-1">•</span> {{ unit.kode_unik }}</p>
                    </div>
                    <span class="shrink-0 text-xs font-semibold px-2.5 py-1 rounded-full {% if unit.status == 'Selesai' %}bg-green-100 text-green-700{% elif unit.status == 'Dalam Proses' %}bg-blue-100 text-blue-700{% else %}bg-amber-100 text-amber-700{% endif %}">{{ unit.status }}</span>
                </a>
                <div class="flex justify-end px-4 pb-1 -mt-2">
                    <a href="/print-qr/{{ unit.kode_unik }}" target="_blank" class="text-xs font-semibold text-blue-600 hover:text-blue-700">Print QR</a>
                </div>
                {% else %}
                <p class="text-sm text-slate-500 text-center py-5">Belum ada perangkat terdaftar.</p>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
