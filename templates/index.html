<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Servis AC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 min-h-screen p-4 md:p-8 text-slate-900" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 15% 15%, rgba(34,211,238,.18), transparent 28rem), radial-gradient(circle at 90% 80%, rgba(37,99,235,.24), transparent 32rem);">

    <div class="max-w-md mx-auto min-h-[calc(100vh-4rem)] flex items-center">
        
        <div class="w-full overflow-hidden rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-9">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-950 text-xl font-bold tracking-widest text-cyan-300 shadow-lg shadow-cyan-900/20">AC</div>
                <p class="text-xs font-bold uppercase tracking-[0.25em] text-blue-600">Service control</p>
                <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">{{ nama_aplikasi }}</h1>
                <p class="mt-2 text-sm leading-6 text-slate-500">Kelola perangkat, servis, dan riwayat perawatan dalam satu tempat.</p>
            </div>

            <div class="space-y-3">
                <a href="/scan-qr" class="group flex w-full items-center justify-between rounded-2xl bg-blue-600 px-5 py-4 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:-translate-y-0.5 hover:bg-blue-700">
                    <span><span class="block text-sm">Scan QR Perangkat</span><span class="mt-1 block text-xs font-normal text-blue-100">Buka status perangkat dengan cepat</span></span><span class="text-xl transition group-hover:translate-x-1">&#8594;</span>
                </a>
                <a href="/login/teknisi" class="group flex w-full items-center justify-between rounded-2xl bg-slate-950 px-5 py-4 font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-800">
                    <span><span class="block text-sm">Login sebagai Teknisi</span><span class="mt-1 block text-xs font-normal text-slate-400">Kelola pelanggan dan history servis</span></span><span class="text-xl text-cyan-300 transition group-hover:translate-x-1">&#8594;</span>
                </a>
                <a href="/login/customer" class="group flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-white px-5 py-4 font-semibold text-slate-800 transition hover:-translate-y-0.5 hover:border-blue-200 hover:bg-blue-50">
                    <span><span class="block text-sm">Login sebagai Customer</span><span class="mt-1 block text-xs font-normal text-slate-500">Pantau perangkat dan jadwal servis</span></span><span class="text-xl text-blue-600 transition group-hover:translate-x-1">&#8594;</span>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
