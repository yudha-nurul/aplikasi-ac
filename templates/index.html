<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Servis AC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800">❄️ {{ nama_aplikasi }}</h1>
                <p class="text-xs text-slate-500 mt-0.5">Mode: Dashboard Teknisi</p>
            </div>
            <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">Teknisi Online</span>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4">➕ Tambah Unit Servis Baru</h2>
            
            <form hx-post="/tambah-unit" 
                  hx-target="#daftar-unit-container" 
                  hx-on::after-request="this.reset()"
                  class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Pelanggan</label>
                    <input type="text" name="nama_pelanggan" required placeholder="Contoh: Pak Ahmad" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mode / Kategori</label>
                        <select name="mode" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                            <option value="AC">AC (Pendingin)</option>
                            <option value="Kulkas">Kulkas</option>
                            <option value="Kipas Angin">Kipas Angin</option>
                            <option value="Mesin Cuci">Mesin Cuci</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama / Detail Unit</label>
                        <input type="text" name="nama_unit" required placeholder="Contoh: AC Kamar Utama 1/2 PK" 
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition shadow-md text-sm">
                    Simpan Unit Baru (Tanpa Reload)
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4">📋 Daftar Unit Terdaftar</h2>

            <div id="daftar-unit-container" class="space-y-3">
                {% include 'partials/daftar_unit.html' %}
            </div>
        </div>

    </div>

</body>
</html>
