<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Aplikasi Servis AC</title>
    <link rel="icon" href="/static/logo_amanah_jaya_teknik128x128.ico" type="image/x-icon">
    <link rel="manifest" href="/static/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 min-h-screen p-4 md:p-8 text-slate-900" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 15% 15%, rgba(34,211,238,.18), transparent 50%), radial-gradient(circle at 85% 85%, rgba(59,130,246,.12), transparent 50%); background-attachment: fixed;">

    <div class="max-w-md mx-auto min-h-[calc(100vh-4rem)] flex items-center">
        
        <div class="w-full overflow-hidden rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-9">
            <div class="mb-8 text-center">
                <img src="/static/logo_amanah_jaya_teknik128x128.ico" alt="Amanah Jaya Teknik" class="mx-auto mb-5 h-24 w-auto drop-shadow-lg">
                <p class="text-xs font-bold uppercase tracking-[0.25em] text-blue-600">Amanah Jaya Teknik</p>
                <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">{{ nama_aplikasi }}</h1>
                <p class="mt-2 text-sm leading-6 text-slate-500">Kelola perangkat, servis, dan riwayat perawatan dalam satu tempat.</p>
            </div>

            <div class="space-y-3">
                <a href="/scan-qr" class="group flex w-full items-center justify-between rounded-2xl bg-blue-600 px-5 py-4 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-600/30">
                    <span><span class="block text-sm">Scan QR Perangkat</span><span class="mt-1 block text-xs font-normal text-blue-100">Buka status perangkat dengan cepat</span></span><span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                </a>
                <a href="/login/teknisi" class="group flex w-full items-center justify-between rounded-2xl bg-slate-950 px-5 py-4 font-semibold text-white transition hover:-translate-y-0.5 hover:bg-slate-900 hover:shadow-lg hover:shadow-slate-900/50">
                    <span><span class="block text-sm">Login sebagai Teknisi</span><span class="mt-1 block text-xs font-normal text-slate-400">Kelola pelanggan dan history servis</span></span><span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                </a>
                <a href="/login/customer" class="group flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-white px-5 py-4 font-semibold text-slate-800 transition hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-lg hover:shadow-slate-950/10">
                    <span><span class="block text-sm">Login sebagai Customer</span><span class="mt-1 block text-xs font-normal text-slate-500">Pantau perangkat dan jadwal servis</span></span><span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
