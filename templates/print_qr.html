<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print QR {{ unit.kode_unik }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>@media print { .print-only-hidden { display: none; } .sheet { margin: 0 !important; border: 0 !important; } }</style>
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 50% 0%, rgba(34,211,238,.18), transparent 28rem);">
    <section class="sheet mx-auto mt-8 w-[80mm] min-h-[100mm] rounded-[2rem] border border-slate-200 bg-white p-8 text-center shadow-2xl md:mt-16">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Device identity</p>
        <h1 class="mt-2 text-lg font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Status &amp; History</h1>
        <img src="/generate-qr/{{ unit.kode_unik }}" alt="QR {{ unit.kode_unik }}" class="mx-auto my-6 h-[58mm] w-[58mm] rounded-xl border border-slate-100 p-2">
        <p class="text-lg font-bold tracking-widest text-slate-950">{{ unit.kode_unik }}</p>
        <p class="mt-2 text-xs text-slate-600">{{ unit.nama_pelanggan }}</p>
        <p class="text-xs text-slate-600">{{ unit.unit }}</p>
        <p class="mt-4 text-xs leading-5 text-slate-400">Scan QR untuk melihat status dan history perangkat.</p>
        <button class="print-only-hidden mt-5 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/20" onclick="window.print()">Print QR</button>
    </section>
</body>
</html>
