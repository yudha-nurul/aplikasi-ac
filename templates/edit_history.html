<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit History Servis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 85% 0%, rgba(34,211,238,.15), transparent 30rem);">
    <main class="mx-auto mt-8 max-w-3xl md:mt-12">
        <section class="rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">{{ record.kode_unik }}</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Edit History Servis</h1>
            <p class="text-sm text-slate-500 mt-2">{{ record.nama_pelanggan }} - {{ record.unit }}</p>
            <form method="post" enctype="multipart/form-data" action="/unit/{{ record.kode_unik }}/history/{{ record.id }}/edit" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="tanggal" class="block text-sm font-semibold text-slate-700 mb-2">Tanggal</label>
                    <input id="tanggal" name="tanggal" type="date" value="{{ record.tanggal }}" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="nama_teknisi" class="block text-sm font-semibold text-slate-700 mb-2">Nama Teknisi</label>
                    <input id="nama_teknisi" name="nama_teknisi" value="{{ record.nama_teknisi }}" readonly required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-600 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label for="item_servis" class="block text-sm font-semibold text-slate-700 mb-2">Item Servis</label>
                    <textarea id="item_servis" name="item_servis" required rows="4" placeholder="Satu item per baris" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ record.item_servis }}</textarea>
                    <p class="text-xs text-slate-500 mt-1">Tulis satu item servis per baris.</p>
                </div>
                <div>
                    <label for="kondisi_before" class="block text-sm font-semibold text-slate-700 mb-2">Kondisi Before</label>
                    <textarea id="kondisi_before" name="kondisi_before" required rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ record.kondisi_before }}</textarea>
                    <label for="foto_before" class="block text-xs font-semibold text-slate-500 mt-3 mb-2">Ganti Foto Before</label>
                    <div class="flex flex-wrap gap-2 mb-2">{% for foto in photo_map.before %}<img src="/uploads/{{ foto }}" alt="Foto before" class="w-16 h-16 object-cover rounded-lg border border-slate-200">{% endfor %}</div>
                    <input id="foto_before" name="foto_before" type="file" accept="image/*" capture="environment" multiple class="w-full text-sm text-slate-500">
                </div>
                <div>
                    <label for="kondisi_after" class="block text-sm font-semibold text-slate-700 mb-2">Kondisi After</label>
                    <textarea id="kondisi_after" name="kondisi_after" required rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ record.kondisi_after }}</textarea>
                    <label for="foto_after" class="block text-xs font-semibold text-slate-500 mt-3 mb-2">Ganti Foto After</label>
                    <div class="flex flex-wrap gap-2 mb-2">{% for foto in photo_map.after %}<img src="/uploads/{{ foto }}" alt="Foto after" class="w-16 h-16 object-cover rounded-lg border border-slate-200">{% endfor %}</div>
                    <input id="foto_after" name="foto_after" type="file" accept="image/*" capture="environment" multiple class="w-full text-sm text-slate-500">
                </div>
                <div class="md:col-span-2">
                    <label for="servis_selanjutnya" class="block text-sm font-semibold text-slate-700 mb-2">Servis Selanjutnya</label>
                    <input id="servis_selanjutnya" name="servis_selanjutnya" type="date" value="{{ record.servis_selanjutnya }}" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2 flex flex-col-reverse sm:flex-row gap-3 pt-2">
                    <a href="/unit/{{ record.kode_unik }}" class="w-full text-center border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl">Batal</a>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl">Simpan Perubahan</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
