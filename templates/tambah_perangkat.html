<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Perangkat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-900 md:p-8" style="font-family: 'DM Sans', sans-serif; background-image: radial-gradient(circle at 80% 0%, rgba(34,211,238,.15), transparent 28rem);">
    <main class="mx-auto mt-8 max-w-lg md:mt-12">
        <section class="rounded-[2rem] bg-white/95 p-7 shadow-2xl shadow-cyan-950/30 ring-1 ring-white/20 md:p-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Data perangkat</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950" style="font-family: 'Space Grotesk', sans-serif;">Tambah Perangkat</h1>
            <div class="mt-5 rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3">
                <p class="text-xs text-slate-500">Pelanggan</p>
                <p class="font-semibold text-slate-800 mt-1">{{ nama_pelanggan }}</p>
            </div>
            <form id="device-form" method="post" action="/pelanggan/{{ nama_pelanggan|urlencode }}/tambah-perangkat" class="mt-6 space-y-4">
                <div>
                    <label for="mode" class="block text-sm font-semibold text-slate-700 mb-2">Kategori Perangkat</label>
                    <select id="mode" name="mode" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                        <option value="AC">AC (Pendingin)</option>
                        <option value="Kulkas">Kulkas</option>
                        <option value="Kipas Angin">Kipas Angin</option>
                        <option value="Mesin Cuci">Mesin Cuci</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div id="other-category" class="hidden">
                    <label for="kategori_lainnya" class="block text-sm font-semibold text-slate-700 mb-2">Tulis Kategori Perangkat</label>
                    <input id="kategori_lainnya" name="kategori_lainnya" placeholder="Contoh: Dispenser" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                </div>
                <div>
                    <label for="nama_unit" class="block text-sm font-semibold text-slate-700 mb-2">Nama / Detail Perangkat</label>
                    <input id="nama_unit" name="nama_unit" required placeholder="Contoh: AC Kamar Utama 1/2 PK" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                </div>
                <button type="submit" class="w-full rounded-xl bg-blue-600 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:-translate-y-0.5 hover:bg-blue-700">Simpan Perangkat</button>
            </form>
            <a href="/dashboard" class="mt-6 block text-center text-sm font-medium text-slate-500 hover:text-blue-600">&#8592; Kembali ke dashboard</a>
        </section>
    </main>
    <script>
        const mode = document.getElementById('mode');
        const otherCategory = document.getElementById('other-category');
        const customCategory = document.getElementById('kategori_lainnya');

        function updateCategoryField() {
            const isOther = mode.value === 'Other';
            otherCategory.classList.toggle('hidden', !isOther);
            customCategory.required = isOther;
        }

        mode.addEventListener('change', updateCategoryField);
        updateCategoryField();
    </script>
</body>
</html>
